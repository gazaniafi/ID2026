<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>HTMLの基礎</title>
</head>
<body>
  <h1>見出し1</h1>
  <h2>見出し2</h2>
  <h3>見出し3</h3>
  <h4>見出し4</h4>
  <h5>見出し5</h5>
  <h6>見出し6</h6>
  <p>段落です。HTMLのタグを練習しています。</p>
  <hr>
  <h2>順序のないリスト</h2>
  <ul>
    <li>ノート</li>
    <li>鉛筆</li>
    <li>消しゴム</li>
  </ul>
  <h2>順序のあるリスト</h2>
  <ol>
    <li>ファイルを作る</li>
    <li>内容を書く</li>
    <li>保存する</li>
  </ol>
  <h2>説明リスト</h2>
  <dl>
    <dt>HTML</dt>
    <dd>文章の構造を表すための言語。</dd>
    <dt>タグ</dt>
    <dd>見出しや段落などの意味を示す印。</dd>
  </dl>
  <h2>画像とリンク</h2>
  <p>ノートと鉛筆のイラストです。<br>画像には説明文も付けています。</p>
  <img src="img/stationery.svg" alt="開いたノートと黄色い鉛筆のイラスト" width="480">
  <p><a href="kadai.html">課題のページへ</a></p>
  <!-- このページは授業で学んだタグの練習用です。 -->
</body>
</html>
